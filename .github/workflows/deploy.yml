name: Automated Quality, Safety & Deployment Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # =========================================================================
  # Quality & Safety Gate: Lint, Typecheck, and Safety Verification Tests
  # =========================================================================
  quality-and-safety-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Dependency Installation
        run: npm ci

      - name: Automated Type Checking & Linting
        run: npm run lint

      - name: Safety Engine & Electrical Unit Verification Tests
        # Runs Ohm's Law, AWG ampacity SAE J1128/DIN 72551, and crimp matrix assertions
        run: npm run test

      - name: Static Production Build Verification
        run: npm run build

      - name: Upload Static Web Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # =========================================================================
  # Conditional Automated Deployment: Executes ONLY if Safety Gate passes 100%
  # =========================================================================
  deploy-to-github-pages:
    needs: quality-and-safety-gate
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && success()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages (Production)
        id: deployment
        uses: actions/deploy-pages@v4
